<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Website</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:rgb(80,80,80);
            font-family:Arial, Helvetica, sans-serif;
        }

        /* ---------- HEADER ---------- */

        .header{
            position:fixed;
            top:0;
            left:0;

            width:100%;
            height:90px;

            background:black;
            color:white;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:0 40px;

            z-index:9999;
        }

        /* Left side (logo + title) */

        .header-left{
            display:flex;
            align-items:center;
            gap:18px;
        }

        #logo{
            width:60px;
            height:60px;
            object-fit:cover;
        }

        .website-title{
            font-size:2rem;
            font-weight:bold;
        }

        /* Right side navigation */

        .navigation-bar{
            display:flex;
            gap:40px;
            font-size:1.2rem;
        }

        .navigation-bar a{
            color:white;
            text-decoration:none;
            transition:0.2s;
        }

        .navigation-bar a:hover{
            color:lightgray;
        }

        /* Keeps content below the fixed header */

        main{
            padding-top:120px;
            color:white;
            font-size:20px;
            padding-left:30px;
        }

    </style>
</head>

<body>

<header class="header">

    <div class="header-left">
        <img id="logo" src="assets/placeholder assets/placeholder image.png">
        <div class="website-title">My Website Title</div>
    </div>

    <nav class="navigation-bar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Meet the Team</a>
        <a href="#">Contact</a>
    </nav>

</header>

<main>
    <p>This is the main text of the webpage.</p>
</main>

</body>
</html>
